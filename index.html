<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circular Screen · 02 Detected · Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 좌표계 : 피그마 1080 단위를 그대로 CSS px 로 쓰고 마지막에 통째로 scale()
   좌표는 모두 padding box 기준 (= 피그마 좌표 - 20px 보더)

   장면 : idle → fill → connecting(별 모션) → connected → message(기록 카드) → guide → follow
   배경 레이어 4장(A~D)이 좌표만 바꿔가며 전 구간을 이어간다. 화면을 갈아끼우지 않는다.
     A .field  Ellipse 59    큰 그라디언트 필드 (idle 에선 중앙의 작은 원)
     B .sheen  Ellipse 58    424x420 #DEF2FF   — 전 구간 고정
     C .core   Ellipse 31229 332x328 #FDFFDE   — connecting 부터 등장
     D .cyan   Ellipse 60    시안 블롭
*/

:root{ --fit: 1238; }                    /* 제품 목업 켰을 때만 하우징 자리를 비운다 */
/* 목업 끈 웹 화면 : 피그마 프레임(1080, 20px 검은 베젤 포함) 을 그대로 보여준다 */
body.bare{ --fit: 1080; }
/* 실기기 : 베젤은 진짜 유리가 대신하므로 실제 표시영역 1022.68 을 꽉 채운다 */
body.kiosk{ --fit: 1046; }   /* 전체화면 : 보이는 원(지름 1040)이 화면 높이 안에 다 들어오게 + 양쪽 3px 여유. 1023 이면 위아래가 잘렸다 */
/* ?s=N 이미지 내보내기 : 피그마 프레임 1080 을 1:1 로 */
body.shot{ --fit: 1080; }

/* 한국어 : SF Pro KR. 재배포 불가 라이선스라 fonts/ 는 저장소에 올리지 않는다(.gitignore).
   파일이 없으면(배포본) Pretendard 로 떨어진다. 한글·한글 문장부호만 이 폰트로 */
/* 길안내 숫자 OffBit Dot Bold(체험판) · 'min' Helvetica Now Display Bold : 이 맥에 설치된 것만 쓴다 (없으면 숫자는 도트 SVG 로) */
@font-face{ font-family:'OffBit Dot'; font-weight:700; src:local('OffBitTrial-DotBold'), local('OffBit Trial Dot Bold'), url('fonts/OffBitTrial-DotBold.woff') format('woff'); }
@font-face{ font-family:'Helvetica Now Bold'; font-weight:700; src:local('HelveticaNowDisplay-Bold'), local('Helvetica Now Display Bold'); }
@font-face{ font-family:'SF Pro KR'; font-weight:600; font-display:block;
  src:url('fonts/SFProKR-Semibold.otf') format('opentype');
  unicode-range:U+1100-11FF, U+3130-318F, U+AC00-D7A3; }
@font-face{ font-family:'SF Pro KR'; font-weight:700; font-display:block;
  src:url('fonts/SFProKR-Bold.otf') format('opentype');
  unicode-range:U+1100-11FF, U+3130-318F, U+AC00-D7A3; }

*{ box-sizing: border-box; }
/* 스크린 밖 여백 : 채도 낮은 검정에 가까운 남색. 스크린 위쪽 감청(#0F1627) 보다 어둡고
   가운데 순검정보다는 밝아, 검은 원이 그대로 원으로 읽힌다 */
html,body{ height:100%; margin:0; overflow:hidden; background:#0B0F18; }
/* ?s=N 이미지샷 : 별도 요청이 없으면 배경색 없이 UI 만 내보낸다 (캔버스까지 투명하게) */
html:has(.shot), html:has(.shot) body{ background:transparent; }
body{
  display:flex; align-items:center; justify-content:center;
  /* 영문 Magnetik(이 맥에 설치, 유료라 저장소엔 없음) · 한글 SF Pro KR(fonts/, 공개 저장소엔 없음). 없는 쪽만 Pretendard 로 (아래 fb-en / fb-ko) */
  font-family:var(--ff-en,'Magnetik'), var(--ff-ko,'SF Pro KR'), 'Pretendard Web', system-ui, sans-serif;

  -webkit-font-smoothing:antialiased;
  cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
}
/* 자간 -1% : letter-spacing 은 계산된 px 로 상속돼서 body 에만 주면
   글자 크기가 다른 곳에서 비율이 어긋난다. 요소마다 em 을 다시 풀어준다 */
.device, .device *{ letter-spacing:0.03em; }
/* 영문 문장·길안내 라벨 : Magnetik 자간 -2% (한글 안내는 위 값 그대로) */
.headline:not(.l-greet), .headline:not(.l-greet) *, .navto, .navto *, .navdest, .navdest *{ letter-spacing:-0.02em; }
.navm{ letter-spacing:-0.01em; }

/* ---------- 폰트 대체 : 배포 링크를 다른 컴퓨터에서 열 때 ----------
   Magnetik(영문)이나 SF Pro KR(한글)이 없으면 JS 가 html 에 fb-en / fb-ko 를 달고 그 글자만 Pretendard 로.
   Pretendard 는 OFL 이라 pretendard/ 에 KS X 1001 서브셋을 둔다 (필요한 굵기만 받는다).
   자간은 실제 문구 폭을 원래 폰트와 재서 맞춘다 : 보정 = (원래 폭 − Pretendard 폭) ÷ (글자 수 × 크기).
   확인용 ?fb=ko,en 로 강제할 수 있다 */
@font-face{ font-family:'Pretendard Web'; font-weight:400; font-display:swap;
  src:local('Pretendard Regular'), local('Pretendard-Regular'), url('pretendard/Pretendard-Regular.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:500; font-display:swap;
  src:local('Pretendard Medium'), local('Pretendard-Medium'), url('pretendard/Pretendard-Medium.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:600; font-display:swap;
  src:local('Pretendard SemiBold'), local('Pretendard-SemiBold'), url('pretendard/Pretendard-SemiBold.subset.woff2') format('woff2'); }
@font-face{ font-family:'Pretendard Web'; font-weight:700; font-display:swap;
  src:local('Pretendard Bold'), local('Pretendard-Bold'), url('pretendard/Pretendard-Bold.subset.woff2') format('woff2'); }
html.fb-ko{ --ff-ko:'Pretendard Web'; }
html.fb-en{ --ff-en:var(--ff-ko,'SF Pro KR'); }   /* 영문만 없으면 한글은 SF Pro KR 그대로, 둘 다 없으면 Pretendard */
/* 한글 600 48px : Pretendard 가 7.6% 넓다 → −0.054em */
html.fb-ko .l-greet, html.fb-ko .l-greet *{ letter-spacing:-0.024em; }

.device{ position:relative; width:1080px; height:1080px; flex:none; transform:scale(var(--s,1)); }

/* ---------- 제품 하우징 (피그마 그룹 = 임의 표현) ---------- */
.ring{
  position:absolute; inset:-78.8px; border-radius:50%;   /* 1237.6 */
  background:#f3e682;
  box-shadow:0 24px 70px rgba(0,0,0,.16);
}
.ring::before{                                            /* 1191.2 */
  content:''; position:absolute; inset:23.2px; border-radius:50%;
  background:radial-gradient(circle closest-side,#cdc47e 90.4%,#fff8c1 100%);
}
body.bare .ring{ display:none; }

/* ---------- 목업 테두리 온오프 토글 (중앙 프레임과 겹치지 않게 우측) ---------- */
.toggle{
  position:fixed; right:16px; top:50%; translate:0 -50%; z-index:10;
  display:flex; align-items:center; gap:9px;
  padding:9px 14px 9px 10px; border:1px solid rgba(0,0,0,.14); border-radius:999px;
  background:#fff; color:#000; cursor:pointer;
  font:inherit; font-size:12px; font-weight:500; line-height:1;
  box-shadow:0 2px 12px rgba(0,0,0,.14);
}
.toggle:hover{ background:#f2f2f2; }
.toggle .sw{
  width:34px; height:20px; border-radius:999px; flex:none;
  background:#000; transition:background-color .2s;
}
.toggle .sw::after{
  content:''; display:block; width:16px; height:16px; margin:2px; border-radius:50%;
  background:#fff; transform:translateX(14px); transition:transform .2s;
}
body.bare .toggle .sw{ background:#d6d6d6; }
body.bare .toggle .sw::after{ transform:none; }
body.kiosk .toggle, body.shot .toggle{ display:none; }   /* 전체화면·내보내기에선 숨김 */
/* 장면 바로 가기 : 구간별로 골라 그 자리부터 재생 (디자인 확인용) */
.jump{ position:fixed; left:16px; top:50%; translate:0 -50%; z-index:10; display:flex; flex-direction:column; gap:4px;
  padding:6px; border-radius:22px; background:#fff; box-shadow:0 2px 12px rgba(0,0,0,.14); }   /* 왼쪽 세로 (오른쪽 목업 토글과 짝) : 스크린과 겹치지 않게 */
.jump button{ text-align:left; }
.jump button{ font:inherit; font-size:12px; font-weight:500; line-height:1; padding:9px 14px; border:0; border-radius:999px;
  background:transparent; color:#000; cursor:pointer; }
.jump button:hover{ background:#f2f2f2; }
.jump button.on{ background:#000; color:#fff; }
body.device .jump, body.shot .jump{ display:none; }   /* 전체화면에서도 보이고, 실기기(#screen)·내보내기에서만 숨김 */
.jump, .jump button{ cursor:pointer; }
body.kiosk{ cursor:none; background:#0B0F18; }   /* 터치/마우스 없는 스크린 */
body.kiosk .ring{ display:none; }             /* 전체화면 : 목업은 항상 숨김 */

/* 카메라 모니터 (테스트용) */
.cam{ position:fixed; right:16px; bottom:16px; z-index:10; width:240px; }
.camview{ display:grid; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
          background:#111; box-shadow:0 2px 12px rgba(0,0,0,.18); }
.camview > *{ grid-area:1/1; width:100%; height:100%; transform:scaleX(-1); }
.camview video{ object-fit:cover; }
.camstat{ margin-top:6px; font-size:11px; line-height:1.5; color:#888;
          text-align:right; white-space:pre-line; }
body.kiosk .cam{ opacity:0; pointer-events:none; }   /* 전체화면 : 사람 썸네일은 절대 노출 안 함 (인식은 계속) */

/* ---------- 스크린 1080x1080 ---------- */
.screen{
  position:absolute; inset:0; border-radius:50%;
  background:#000;
  overflow:hidden;
  /* 피그마 프레임은 border:20px solid #000 : 표시영역은 20px 안쪽 원 */
  clip-path:circle(520px at 540px 540px);
}
/* 위아래 색 띠 (피그마 3124:17775 의 감청 / 밝은 회색) :
   직선 그라디언트는 검은 화면에서 경계가 가로줄로 보인다 → 스크린과 같은 중심(540,540)의 동심원으로 번지게 하고
   위/아래 방향은 아주 긴 마스크로만 나눈다. 등색선이 테두리와 같은 곡률(가운데가 높고 옆이 낮다)로 휜다 */
.screen::before, .screen::after{ content:''; position:absolute; inset:0; pointer-events:none;
  transition:opacity 1.4s ease; }   /* idle → fill 로 넘어갈 때 뚝 켜지지 않고 스며 나온다 */
.screen::before{   /* 위 : 감청 */
  background:radial-gradient(circle 530px at 540px 540px, rgba(22,33,58,0) 68%, rgba(20,29,50,.4) 86%, #16213A 97%, #16213A 100%);
  -webkit-mask:linear-gradient(180deg,#000 0 7%, rgba(0,0,0,.7) 18%, transparent 32%);
          mask:linear-gradient(180deg,#000 0 7%, rgba(0,0,0,.7) 18%, transparent 32%); }
.screen::after{    /* 아래 : 밝은 회색 */
  background:radial-gradient(circle 530px at 540px 540px, rgba(43,49,60,0) 70%, rgba(39,45,55,.4) 87%, #2B313C 97%, #2B313C 100%);
  -webkit-mask:linear-gradient(0deg,#000 0 6%, rgba(0,0,0,.72) 17%, transparent 30%);
          mask:linear-gradient(0deg,#000 0 6%, rgba(0,0,0,.72) 17%, transparent 30%); }
/* 기본 화면(얼굴 인식 전)은 위아래 아무것도 없이 순검정. 띠는 구슬이 커질 때부터 */
body.idle .screen::before, body.idle .screen::after, body.idle .rimlight{ opacity:0; }
/* 길안내 게이지가 아래 띠와 밝기가 비슷해 뒤 레이어처럼 보였다 → 그 장면에선 띠를 낮춰 게이지를 앞세운다 */
body.follow .screen::after{ opacity:.45; }
/* 그 색이 가장자리를 따라 아주 천천히 돈다 : 원뿔 그라디언트를 테두리 쪽만 남기고 회전 */
.rimlight{ position:absolute; inset:-8%; pointer-events:none;
  background:conic-gradient(from 0deg,
    rgba(30,44,76,0)    0deg, rgba(36,52,90,.5)   55deg, rgba(22,29,48,0)  135deg,
    rgba(62,69,83,0)  205deg, rgba(62,69,83,.4)  275deg, rgba(30,44,76,0)  360deg);
  -webkit-mask:radial-gradient(circle closest-side, transparent 70%, #000 92%);
          mask:radial-gradient(circle closest-side, transparent 70%, #000 92%);
  opacity:.55; transition:opacity 1.4s ease; animation:rimOrbit 18s linear infinite; }
@keyframes rimOrbit{ to{ rotate:360deg; } }
.bezel{ position:absolute; inset:0; width:1080px; height:1080px;
        z-index:4; pointer-events:none; }


/* ---------- 배경 레이어 : 기본값 = message(본문) 상태 ---------- */
/* blur 는 래퍼에 : 자식을 scale() 해도 흐림 반경이 같이 커지지 않게 */
/* 블러는 구슬 가장자리가 보이는 장면(idle/connecting)에만.
   꽉 찬 장면에선 가장자리가 화면 밖이라 흐릴 게 없고, 블러 계단만 잔물결처럼 남는다.
   지연 1s : 끌 때만 늦춰서 구슬이 다 커진 뒤에 사라지게 (켤 때는 즉시) */
.blur39{ position:absolute; inset:0; filter:none; transition:filter .8s ease 1s; }
.field{ position:absolute; left:28px; top:-132px; width:1022px; height:1053px;
        border-radius:50%; background:linear-gradient(180deg,#fff 23.89%,#f6e280 100%); }
/* 블러 대신 라디얼 그라디언트 : 크기는 원본 + 블러 반경(±100)만큼 키우고
   중심은 그대로 둔다. 밴딩(등고선)이 안 생겨 흐를 때 잔물결이 안 보인다 */
.sheen{ position:absolute; left:313px; top:-172px; width:624px; height:620px;
        opacity:.72;
        background:radial-gradient(closest-side,#def2ff 0 30%,rgba(222,242,255,0) 100%); }
.core { position:absolute; left:230px; top:354px; width:532px; height:528px;
        background:radial-gradient(closest-side,#fdffde 0 26%,rgba(253,255,222,0) 100%); }
.cyan { position:absolute; left:131px; top:-80px; width:916px; height:621px;
        opacity:.19;
        background:radial-gradient(closest-side,#8afff3 0 26%,rgba(138,255,243,0) 100%); }

.field,.sheen,.core,.cyan{
  transform-origin:50% 50%;
  transition:transform 1.8s cubic-bezier(.45,0,.15,1), opacity 1.2s ease,
             translate 1.2s ease, scale 1.2s ease, rotate 1.2s ease,
             border-radius 1.2s ease;
}

/* A : 중앙의 작은 원 → 화면을 채움 → 각 장면의 좌표로 흘러감 */
body.idle       .field{ transform:translate(1px,145.5px) scale(.22); }
/* 1.14 = 1022x1053 타원이 지름 1080 원을 완전히 덮는 배율(블러 39px 여유 포함) */
/* 기본 화면은 검정 : 구슬은 idle 크기 그대로 조용히 사라진다 */
/* 얼굴이 가까워지면(fill) 구슬이 사라지지 않고 화면을 채우며 커진다. 대신 옅게 해서 화면은 어둡게 유지 */
body.fill       .field{ transform:translate(1px,145.5px) scale(.16); opacity:0; }   /* 원은 조금 작아지고 흐려지며 어두워진다 : 뒤로 물러나는 느낌. 돌아올 땐 반대로 뒤에서 앞으로 */
body.fill       .blur39{ filter:blur(30px); transition-delay:0s; }
/* 구슬이 커질 때도 위아래 띠는 보여야 한다. 다만 구슬과 겹쳐 색이 뜨지 않게 살짝만 낮춘다 */
body.fill .screen::before, body.fill .screen::after{ opacity:0; transition:none; }   /* 얼굴 근접 : 띠는 캔버스(.bandc)가 12시부터 한 바퀴 그리며 */
.bandc{ position:absolute; inset:0; width:1080px; height:1080px; pointer-events:none; opacity:0; }
body.fill .bandc{ opacity:.85; }
@keyframes rimIn{ 0%, 15%{ opacity:0; } 100%{ opacity:.35; } }
body.fill .rimlight{ opacity:.35; animation:rimIn 2s both, rimOrbit 18s linear infinite; }
/* connecting : 엄지척 순간 구슬은 그 자리·그 모습(노랑) 그대로 옅어지며 사라진다.
   예전엔 커지고(.58) 더 흐려지며(39px) 흰 덩어리로 번져 별 모션을 흐렸다 */
body.connecting .field{ transform:translate(1px,145.5px) scale(.22); transition-duration:1.8s, .6s, 1.2s, 1.2s, 1.2s, 1.2s; }
body.connected  .field,
body.message    .field,
body.guide      .field,
body.follow     .field{ transform:translate(1px,145.5px) scale(1.2); }
body.bye        .field{ transform:translate(1px,145.5px) scale(.17); }   /* 보이지 않는 동안 조금 작게 : idle 에서 살짝 커지며 떠오른다 */
body.bye        .blur39{ filter:blur(30px); transition-delay:0s; }

/* 검은 화면 장면들 : 예전 밝은 배경 레이어는 전부 물러난다 */
body:not(.idle) .sheen,
body:not(.idle) .cyan,
body:not(.idle) .core,
body:not(.idle):not(.fill) .field{ opacity:0; }

/* C : connecting 에서 켜진다 */
/* 노치가 작아져 상단이 드러난다 : idle 은 순수 블랙이어야 하므로 sheen 을 끈다 */
body.idle .sheen{ opacity:0; }
body.idle .core, body.fill .core{ transform:scale(.4); opacity:0; }
body.connecting  .core{ transform:translate(9px,-29px); }

/* D : 본문 장면에서만 크게 */
body.idle .cyan{
  transform:translate(9px,172.5px) scale(.469); opacity:.09;
}

/* 살아있는 듯한 움직임 : transform 은 상태 전환이 쓰므로 개별 속성으로 분리.
   합성 순서상 translate 는 scale 바깥이라, 작을 때는 크게 배회하고 클 때는 은근하게 흐른다. */
/* 배회는 idle 에서만. 원이 커진 뒤에는 멈추고 중앙에 정렬된다 */
/* wander 는 위치, ripple 은 실루엣, sway 는 그라디언트 광, bloom 은 발광.
   주기가 서로 안 나누어떨어져 같은 모양이 반복되지 않는다. */
body.idle .field{
  animation:wander 30s linear      infinite,
            ripple  6s ease-in-out infinite,
            sway    7s ease-in-out infinite alternate;
}
/* 발광 링 : 구슬 바깥 테두리만 밝게. 안쪽 그라디언트는 원래대로 둔다 */
.field::before{
  content:''; position:absolute; inset:-9%; border-radius:inherit;
  opacity:0; transition:opacity .8s ease;
  background:conic-gradient(from 0deg,
    rgba(255,250,214,1) 0deg, rgba(255,246,196,.3) 100deg,
    rgba(255,246,196,.1) 190deg, rgba(255,248,204,.45) 280deg, rgba(255,250,214,1) 360deg);
  /* 안쪽 68% 는 완전히 비어 있다 — 중심에는 아무것도 안 섞인다 */
  -webkit-mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
          mask:radial-gradient(circle closest-side, transparent 68%, #000 88%, #000 100%);
}
body.idle .field::before{ opacity:1; animation:gleam 9s ease-in-out infinite; }
/* 맥동이 아니라 : 밝은 쪽이 돌다가 되돌아보고 다시 나아간다. 세기도 같이 오르내린다 */
@keyframes gleam{
   0%  { rotate:  0deg; opacity:.5;  }
  22%  { rotate:132deg; opacity:1;   }
  38%  { rotate: 98deg; opacity:.62; }
  62%  { rotate:254deg; opacity:1;   }
  80%  { rotate:222deg; opacity:.55; }
 100%  { rotate:360deg; opacity:.5;  }
}
/* 39px 로는 구슬에 가장자리가 안 생겨 광택이 그려질 데가 없다 */
body.idle       .blur39{ filter:blur(17px); transition-delay:0s; }
body.connecting .blur39{ filter:blur(17px); transition-delay:0s; }
/* 정적 장면에서 .field 를 움직이면 어떻게든 검정이 드러난다. 고정.
   (검은 화면 장면에선 배경 블롭도 모두 꺼져 있다) */
body:not(.idle) .field{ animation:none; translate:0 0; scale:1; rotate:0deg; border-radius:50%; }
/* 글자만 있는 장면에서는 배경을 아예 멈춘다 : 아주 작은 움직임도

body:not(.idle):not(.connecting) .core,
body:not(.idle):not(.connecting) .cyan{ animation:none !important; }
.sheen{ animation:drift2 14s ease-in-out infinite alternate; }
.core { animation:drift4 17s ease-in-out infinite alternate; }
.cyan { animation:drift3 21s ease-in-out infinite alternate; }
/* 시선을 옮기는 생물처럼 : 짧고 빠르게 도약(7%) → 길게 머물며 미세하게 흔들림(18%).
   구간마다 timing-function 을 따로 줘서 도약은 튕겨나가듯, 체류는 거의 멈춘 듯 보이게 한다. */
@keyframes wander{
   0%  { translate:  0px   0px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
   7%  { translate:-46px -30px; scale:1.09 .93;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  25%  { translate:-38px -22px; scale:1.01 1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  32%  { translate: 30px -54px; scale:.92  1.11; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  48%  { translate: 24px -44px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  54%  { translate: 56px  18px; scale:1.08 .94;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  70%  { translate: 48px  14px; scale:1    1.01; animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  77%  { translate:-28px  48px; scale:.94  1.08; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  93%  { translate:-22px  40px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
 100%  { translate:  0px   0px; scale:1    1;    }
}
@keyframes sway{ from{ rotate:-30deg; } to{ rotate:30deg; } }
@keyframes ripple{
   0%,100%{ border-radius:50% 50% 50% 50% / 50% 50% 50% 50%; }
  20%     { border-radius:63% 37% 44% 56% / 41% 59% 41% 59%; }
  40%     { border-radius:39% 61% 59% 41% / 59% 37% 63% 41%; }
  60%     { border-radius:57% 43% 37% 63% / 44% 63% 37% 56%; }
  80%     { border-radius:42% 58% 62% 38% / 61% 42% 58% 39%; }
}

/* 문장 규칙 (피그마 3142:328) : 흰 40px Medium, 강조어는 Semi Bold 에 번짐.
   피그마는 강조어를 blur 5.95 로 한 겹 뒤에 까는데 text-shadow 한 줄로 같다 */
.headline{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  margin:0; width:780px; text-align:center;
  font-size:36px; font-weight:500; line-height:1.8; color:#fff;   /* 영문 문장은 모두 36px (링 R 410 안 : 가장 긴 줄 끝이 중심에서 330 이내) */
  transition:opacity .8s ease;
}
/* inline-block : 인라인 em 의 박스는 줄 상자보다 10px 아래에서 시작해 글리밍 겹이 그만큼 내려갔다.
   inline-block 이면 박스가 단어(.w) 와 같은 줄 상자라 겹이 글자와 정확히 겹친다 */
.headline em{ font-style:normal; font-weight:600; display:inline-block; }
/* 글리밍 (피그마 3153:219) : 같은 글자를 #FEFFF9 로 한 겹 더 얹고, 오른쪽으로 갈수록 더 흐리게.
   피그마 코드젠은 progressive blur 를 균일 blur 5.95 로 납작하게 내보낸다 → 흐림이 다른 두 겹을
   왼쪽은 비우고 오른쪽으로 드러내 흐림이 오른쪽으로 번져 가게. 글자는 JS 가 data-t 로 복사 */
.glim{ position:relative; }
.glim::before, .glim::after{ content:attr(data-t); position:absolute; left:0; right:0; top:0;
  color:#FEFFF9; white-space:nowrap; pointer-events:none; }
/* 마스크 두 겹 : (1) 오른쪽으로 갈수록 짙어지는 번짐 (2) 왼→오로 열리는 와이프.
   교집합이라 와이프 폭이 0 이면 아무것도 안 보이고, 커지면서 글자와 같은 방향으로 번짐이 따라온다 */
.glim::before, .glim::after{
  -webkit-mask-repeat:no-repeat;   mask-repeat:no-repeat;
  -webkit-mask-position:0 0, 0 0;  mask-position:0 0, 0 0;
  -webkit-mask-size:100% 100%, 140% 100%;  mask-size:100% 100%, 140% 100%;
  -webkit-mask-composite:source-in;        mask-composite:intersect; }
.glim::before{ filter:blur(2px);
  -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 22%), linear-gradient(90deg,#000 0 68%, transparent 100%);
          mask-image:linear-gradient(90deg,transparent 0%,#000 22%), linear-gradient(90deg,#000 0 68%, transparent 100%); }
.glim::after { filter:blur(4px);
  -webkit-mask-image:linear-gradient(90deg,transparent 5%,#000 45%), linear-gradient(90deg,#000 0 68%, transparent 100%);
          mask-image:linear-gradient(90deg,transparent 5%,#000 45%), linear-gradient(90deg,#000 0 68%, transparent 100%); }
/* 기록 → 재진 : 카드 없이 문장만. 첫 문장은 화면 가운데 한 줄, 다음 문장이 나오면 첫 문장이 위로 한 칸
   올라가 두 줄이 되고 둘이 함께 화면 가운데에 놓인다 (36px × 행간 1.8 = 줄 상자 64.8 → 반씩 ±32.4) */
.l-msg, .l-fu{ width:auto; white-space:nowrap; font-size:36px; }
.l-fu{ translate:0 32.4px; }

/* 장면당 한 문장. 들어올 때는 즉시, 나갈 때만 천천히 사라진다 */
.headline{ opacity:0; }
body.fill    .l-greet,

body.guide   .l-guide{ opacity:1; transition-duration:.15s; }

body.followup .l-msg{ opacity:1; translate:0 -32.4px;
  transition:translate .8s cubic-bezier(.45,0,.2,1), opacity .15s ease; }
/* 다음 장면으로 넘어가며 사라질 때도 윗줄은 제자리 : 이 규칙이 없으면 translate 가 0 으로 튀어
   두 줄 간격이 갑자기 좁아진 채 흐려졌다. 강조어 번짐도 그대로 이어서 흐려지게 */
body.guide .l-msg{ translate:0 -32.4px; }
body.guide .l-msg em .c, body.guide .l-fu em .c{ animation:emGlow 2.4s ease-in-out infinite alternate; animation-delay:calc(var(--ei) * 90ms); }

/* 기본 화면 문구 (피그마 3124:17778) : Delight Semi Bold 67.3px.

.l-greet, .l-hi{ width:auto; white-space:nowrap;
                  font-size:67.319px; font-weight:600; line-height:1.5; }
.l-greet, .l-hi{ font-size:48px; line-height:1.6; }   /* 두 줄 : 한국어·영어가 줄끼리 겹친다 */
.l-greet{ line-height:1.42; }   /* 한글은 행간을 좁게 : 두 언어의 차(0.18)를 유지해 줄끼리 겹치게 */
.l-hi{ font-size:36px; line-height:1.8; font-weight:500; }   /* 영문 문장은 모두 36px · 행간 1.8 · Medium */
/* 두 문구의 박스를 같은 폭으로 : 지우개 경계가 화면 같은 x 를 지나가게 */
.l-greet, .l-hi{ width:780px; }
/* 피그마 원본은 아래로 #353046 까지 어두워지는 그라디언트인데, 검은 화면에선 글자 아랫부분이 배경에 묻혀
   물음표 점(줄 박스 72~90% 구간)이 뚝 잘린 것처럼 보인다 → 단색으로 */
.l-greet .c{ color:#E5E5E5; }
/* 엄지척 뒤 안내 문구 : 흰색이 줄 박스 66% 까지 가득하고 아래 끝에서만 살짝 옅어진다. 글자(.c)마다 입힌다 —
   단어(.w)에 입히면 background-clip:text 가 아직 안 켜진 글자까지 그려 단어가 통째로 먼저 보인다 */
.headline:not(.l-greet) .c{ background:linear-gradient(180deg,#fff 0 66%,rgba(255,255,255,.55) 100%);
                       -webkit-background-clip:text; background-clip:text; color:transparent; }
.headline:not(.l-greet) em .c{ background:none; color:#fff; }
/* Magnetik 의 T·J 등은 글자 상자 밖으로 삐져나와 background-clip:text 에 잘린다 → 칠할 영역만 양옆으로 넓힌다 (배치는 그대로) */
.headline:not(.l-greet) .c{ padding:0 .08em; margin:0 -.08em; }
/* 스트로크가 켜진 뒤의 문장 : 링 빛처럼 흰빛에서 아래로 옅은 청록, 은은한 번짐. 강조어는 같은 계열의 색 번짐 */
.l-hi .c, .l-msg .c, .l-fu .c, .l-guide .c, .l-bye .c{ background:linear-gradient(180deg,#fff 0 32%,#fcf9ea 52%,#e2f6fb 74%,rgba(186,232,246,.8) 100%); }   /* 흰빛 → 아주 옅은 노랑 → 옅은 청록 */
.l-hi em .c, .l-msg em .c, .l-fu em .c, .l-guide em .c, .l-bye em .c{ background:none; color:#fffdf0; }   /* 강조어 : 아주 옅은 노란 흰빛 */
.l-hi, .l-msg, .l-fu, .l-guide, .l-bye{ filter:drop-shadow(0 0 .18em rgba(160,222,242,.16)) drop-shadow(0 0 .34em rgba(255,236,172,.16)); }
.l-msg em.glim::before, .l-fu em.glim::before, .l-guide em.glim::before{ color:#d9f5ff; }   /* 안쪽 겹 : 옅은 청록 */

.w{ display:inline-block; }   /* 단어는 줄바꿈 묶음만. 보이기·애니메이션은 글자(.c)에서 */

   색은 엄지척 구에서 : 흰 핵 · 연두 #F5FC83 · 파랑 #71ACFB · 하늘 #8AFFF3 (글자마다 두 색 짝 --g1/--g2 를 돌려 쓴다).
   번짐은 글자가 켜질 때 가장 밝고 뒤따르는 글자 몇 개가 지나는 동안 사라져 늘 맨 끝 글자만 빛나 보인다.
   글자는 인라인 span(.c) : inline-block 이면 커닝이 끊겨 모양이 바뀐다.
   켜지기 전의 숨김은 animation-fill-mode:both 가 맡는다 (기본은 보임 → 장면이 바뀌면 문장이 통째로 흐려지며 사라진다) */
@keyframes letterIn{

/* 길안내 라벨 */
body.follow .navto .c, body.follow .navdest .c, body.bye .navto .c, body.bye .navdest .c{ animation:letterIn .75s cubic-bezier(.25,.6,.3,1) both; animation-delay:calc(var(--t) * 1ms + 200ms); }
/* 인사 문구는 제자리에서 나타나고 사라진다 (위→아래·왼→오른쪽 순서는 --i 그대로).
   원이 화면을 다 채운 다음(transform 1.8s)에 이어서 */

/* fill 에서 6초마다 문구가 바뀐다 (JS askRun). 다음 문구부터는 원이 이미 차 있으니 바로 올라오고,
   바뀌기 전 0.5s 동안 흐려지며 살짝 올라가 사라진다. out 이 cyc 보다 뒤에 있어야 지연 0 이 이긴다 */
/* 다음 문구는 앞 문구가 사라지는 동안(0.5s 뒤부터) 같은 순서로 천천히 올라온다 : 부드럽게 말을 거는 느낌 */
@keyframes out{
  from{ opacity:1; filter:blur(0);   }
  to  { opacity:0; filter:blur(8px); }
}
@keyframes in{
  from{ opacity:0; transform:translateY(.42em); filter:blur(10px); }
  to  { opacity:1; transform:none;              filter:blur(0);    }
}
/* 인사 전환 (connected 5600ms, 스트로크가 켜지면서) : 글자는 제자리. 움직이는 건 마스크 경계와 투명도.
   바뀌는 건 엄지척 순간 떠 있던 마지막 문구 (한 줄이든 두 줄이든 줄마다)
     0 ~  900  엄지척 직후 : 구가 아래에서 바로 올라와 화면을 채운다
   900 ~ 1900  스트로크가 가장자리에 차오른다 (0.8배 재생이라 링이 차는 데 1s)
  1100 ~ 3600  윗줄 : 흐린 경계가 왼→오로 천천히 지나가며 한국어를 지운다
  1700 ~ 4400  윗줄 : 같은 속도로 600ms 뒤따르며 영어를 드러낸다 (2.7s : 이름이 천천히 드러나게).
               600ms = 흐린 경계 폭(30%)이 지나가는 시간 : 두 경계가 맞닿기만 하고 겹치지 않아
               한 자리에 두 언어가 같이 보이는 순간이 없다
  +600ms       아랫줄은 0.6초 늦게 : 위→아래 순서
   마스크는 줄(.ln)마다. 폭 300% 그라디언트(가운데 10% 가 흐린 경계)를 85%→15% 로 민다 */
.l-greet .ln, .l-hi .ln, .l-guide .ln{ display:block; }
/* 번짐이 줄 박스(마스크 영역) 위아래에서 잘리지 않게 여유를 준다. 배치는 그대로.
   블록끼리는 줄 사이 음수 여백이 겹쳐(margin collapse) 18px 이 한 번만 빠져 줄 간격이 벌어진다 →
   flex 세로 배치로 겹침을 막아 위아래 여백이 정확히 상쇄되게 */
.l-greet, .l-hi{ display:flex; flex-direction:column; }   /* stretch : 줄 폭 780 유지 (마스크 경계 정렬) */
.l-greet .ln, .l-hi .ln{ padding:18px 0; margin:-18px 0; }
body.connected .l-greet .ln{
  -webkit-mask:linear-gradient(90deg,transparent 0 45%,#000 55% 100%) 85% 0 / 300% 100% no-repeat;
          mask:linear-gradient(90deg,transparent 0 45%,#000 55% 100%) 85% 0 / 300% 100% no-repeat;
  animation:deLine 5600ms linear both; }
body.connected .l-greet .ln + .ln{ animation-delay:460ms; }
@keyframes deLine{
  0%, 5.36%    { opacity:1; -webkit-mask-position:85% 0; mask-position:85% 0; animation-timing-function:ease-in-out; }   /* 한국어는 0.3s 만 */
  22.5%        { opacity:.5; }
  39.64%, 100% { opacity:0; -webkit-mask-position:15% 0; mask-position:15% 0; }   /* 지우기 1.92s (예전 2.5s 의 1.3배 속도) */
}

/* 줄 글리밍 겹 : 한국어는 지워지는 한가운데(2.35s), 영어는 드러나는 한가운데(3.05s)에 가장 밝다.
   줄 글리밍은 전환 마스크가 이미 왼→오로 지나가므로 와이프 마스크는 끝까지 열어 둔다 */
.ln.glim::before, .ln.glim::after{ top:18px; opacity:0;
  -webkit-mask-size:100% 100%, 140% 100%; mask-size:100% 100%, 140% 100%; }
/* 강조어 글리밍은 글자와 같은 시각·같은 길이로 떠오른다 (전에는 글자가 다 나타난 뒤 1.0s 에 켜져 나중에 얹힌 느낌) */
.headline em.glim::before, .headline em.glim::after{ opacity:0; }
/* em 은 인라인 : left/right 0 + 가운데 정렬이면 겹의 글자 폭(attr 텍스트)과 본문 폭(단어 span + 자간)
   차이만큼 좌우로 어긋난다. 왼쪽 기준으로 붙여 시작점을 맞춘다 */
.headline em.glim::before, .headline em.glim::after{ right:auto; text-align:left; }
/* 강조어 글리밍 겹은 얇게 : 번짐이 두꺼우면 글자가 뭉개져 보였다 (줄 글리밍은 그대로) */
.headline em.glim::before{ filter:blur(1px); }
.headline em.glim::after { filter:blur(2px); }
/* 강조어 글리밍은 그 강조어의 첫 글자가 켜질 때 시작해 마지막 글자가 켜질 때까지 훑는다 (--t0 · --tn 은 JS) */
body.message  .l-msg em.glim::before,  body.message  .l-msg em.glim::after,
body.followup .l-fu em.glim::before,   body.followup .l-fu em.glim::after,
body.guide    .l-guide em.glim::before, body.guide   .l-guide em.glim::after{
  animation:glimWipe calc(var(--tn) * 1ms + 1300ms) cubic-bezier(.3,.5,.4,1) both;
  animation-delay:calc(var(--t0) * 1ms + var(--base)); }
body.followup .l-msg em.glim::before, body.followup .l-msg em.glim::after{ opacity:1;
  -webkit-mask-size:100% 100%, 140% 100%; mask-size:100% 100%, 140% 100%; }
@keyframes glimWipe{
  from{ opacity:0; -webkit-mask-size:100% 100%, 0% 100%;   mask-size:100% 100%, 0% 100%;   }
  8%  { opacity:1; }
  65% { opacity:1; -webkit-mask-size:100% 100%, 140% 100%; mask-size:100% 100%, 140% 100%; }
  to  { opacity:.42; -webkit-mask-size:100% 100%, 140% 100%; mask-size:100% 100%, 140% 100%; }   /* 단어가 다 쓰이면 번짐을 줄여 읽히게 */
}
body.connected .l-greet .ln.glim::before, body.connected .l-greet .ln.glim::after{ animation:glimKo 5600ms linear both; }
body.connected .ln + .ln.glim::before, body.connected .ln + .ln.glim::after{ animation-delay:460ms; }
@keyframes glimKo{ 0%, 5.36%{ opacity:0; } 22.5%{ opacity:.9; } 39.64%, 100%{ opacity:0; } }
/* 지워진 뒤 다음 장면으로 넘어갈 때 마스크가 풀리며 한국어가 비치지 않게 즉시 끈다 (별 모션·기기 번호 동안에도 숨김) */
body:not(.fill):not(.connected) .l-greet{ transition:none; }
/* 엄지척(맥락 전달) : 떠 있던 한국어 문장이 그 자리에서 어두워지고, 그 위로 별 모션이 입혀지며 함께 사그라든다 */
body.connecting.fromfill .l-greet{ opacity:1; animation:koUnder 2.3s ease both; }
@keyframes koUnder{
  0%   { opacity:1;   filter:brightness(1); }
  22%  { opacity:.9;  filter:brightness(.42); }
  70%  { opacity:.45; filter:brightness(.32); }
  100% { opacity:0;   filter:brightness(.3); }
}

/* ---------- connecting : AE 별 모션 ----------
   검정 위에 얹으므로 screen : 영상의 검은 부분은 배경 그라디언트가 그대로 비친다 */
.star{ position:absolute; inset:0; width:1080px; height:1080px; object-fit:cover; z-index:2;
       opacity:0; transition:opacity .45s ease; mix-blend-mode:screen; pointer-events:none; }
/* 새 엄지척 영상(별_1.mp4)은 크롭 단계에서 중심·크기를 맞췄으므로 CSS 보정이 없다.
   실측(인코딩 결과) : 절정 1.9s 에 중심 540.4,541.5 · R 521.7 (스크린 반지름 520) */
body.connecting .star{ opacity:1; }   /* 엄지척 뒤엔 영상만 (파장 효과는 뺐다) */
/* connected · message : 스크린 가장자리에 붙인 스트로크 (가장 밝은 선 약 518 = 가장자리 520, 바깥 글로우는 잘린다) */
/* z-index 3 : 스크린 안 콘텐츠보다 위, 노치(.bezel z4)보다 아래. screen 합성이라 링 글로우가 아래 것 위에 얹힌다 */
/* 스트로크 링 (레퍼런스 : 링 빛이 크게 번지고 안쪽은 검은 원이 또렷하게 자른다)
   .sring 한 묶음 = 흐린 영상(.sglow) + 바깥으로 갈수록 더 흐려지는 고리 세 겹(.pb) + 그 위 검은 원(.sdisc).
   z-index 0 : 뒤에 오는 문구보다 아래 (검은 원이 글자를 가리지 않게) */
.sring{ position:absolute; inset:0; z-index:0; pointer-events:none; opacity:0; transition:opacity .6s ease; }
.sglow{ position:absolute; inset:0; filter:blur(4px) brightness(1.25); }   /* 영상을 먼저 원형으로 자른 뒤 흐린다 : 사각 테두리 없이 번짐이 바깥으로 퍼진다 */
.pb{ position:absolute; inset:0; }
/* progressive : 링(R 410)에서 바깥으로 갈수록 흐림이 세진다 */
.pb1{ -webkit-backdrop-filter:blur(3px);  backdrop-filter:blur(3px);
  -webkit-mask:radial-gradient(circle at 540px 540px, transparent 404px, #000 420px); mask:radial-gradient(circle at 540px 540px, transparent 404px, #000 420px); }
.pb2{ -webkit-backdrop-filter:blur(6px);  backdrop-filter:blur(6px);
  -webkit-mask:radial-gradient(circle at 540px 540px, transparent 418px, #000 442px); mask:radial-gradient(circle at 540px 540px, transparent 418px, #000 442px); }
.pb3{ -webkit-backdrop-filter:blur(11px); backdrop-filter:blur(11px);
  -webkit-mask:radial-gradient(circle at 540px 540px, transparent 436px, #000 470px); mask:radial-gradient(circle at 540px 540px, transparent 436px, #000 470px); }
/* 검은 원 : 링보다 살짝 작게. 반지름이 숨쉬듯 조금씩 드나들어 빛의 안쪽 경계가 가장자리를 따라 일렁인다 */
/* 일렁이는 모양은 안쪽 <i> 를 자르고(JS discLoop) 바깥을 흐려 가장자리를 부드럽게 : 검은 도형이 있다는 인상 없이 빛이 안쪽으로 스며들게.
   (한 요소에 흐림과 자르기를 같이 주면 흐린 뒤 잘라 경계가 다시 또렷해진다) */
.sdisc{ position:absolute; inset:0; filter:blur(10px); }
.sdisc > i{ position:absolute; inset:0; background:#000; clip-path:circle(398px at 540px 540px); }
/* 링 빛도 아주 살짝 타원으로 흔들려 검은 원과 어긋나며 굵기가 둘레를 따라 달라진다 */
.sglow{ animation:ringWob 4.3s ease-in-out infinite; }
@keyframes ringWob{ 0%, 100%{ scale:1 1; } 25%{ scale:1.012 .992; } 50%{ scale:.994 1.01; } 75%{ scale:1.008 .996; } }
/* 등장 : 가운데의 작은 고리에서 부드럽게 커지며, 처음엔 어둡다가 다 커졌을 때 완전히 밝게 */
@keyframes ringIn{ 0%{ scale:.16; filter:brightness(.22); } 55%{ filter:brightness(.55); } 100%{ scale:1; filter:brightness(1); } }
.stroke{ position:absolute; inset:0; width:1080px; height:1080px; object-fit:cover;
         scale:.8;     /* 링을 가장자리가 아니라 안쪽에 : 밝은 선 R 513 × .8 ≈ 410 (스크린 520 의 75%, 레퍼런스 실측) */
         /* 줄이면 영상 프레임(1080) 끝이 사각으로 보인다 → 링 바로 바깥에서 원형으로 흐려 끊는다 (흐림은 부모 .sglow 에서) */
         -webkit-mask:radial-gradient(circle closest-side, #000 94%, transparent 100%);
                 mask:radial-gradient(circle closest-side, #000 94%, transparent 100%);
         pointer-events:none; }
body.connected .sring, body.message .sring, body.followup .sring, body.guide .sring{ opacity:1; animation:ringIn 1.7s cubic-bezier(.22,.61,.2,1) both; }
/* 스트로크가 도는 동안은 영상만 : 위아래 색 띠와 가장자리 발광을 끈다 */
body.connected .screen::before, body.connected .screen::after, body.connected .rimlight, body.message .screen::before, body.message .screen::after, body.message .rimlight, body.followup .screen::before, body.followup .screen::after, body.followup .rimlight, body.guide .screen::before, body.guide .screen::after, body.guide .rimlight, body.connecting .screen::before, body.connecting .screen::after, body.connecting .rimlight{ opacity:0; }

/* ---------- bye : 도착 뒤 인사하고 대기 상태로 ----------
   도착 3.5s 뒤 길안내가 옅어지고(.8s) → 'Take care, Leo!' 가 쓰였다 사라지고 →
   위아래 색 띠가 12시부터 시계 방향으로 돌며 지워지는 순간 노란 구슬이 살짝 커지며 떠오른다 (JS eraseBands · idle) */
body.bye .nav > *{ opacity:0; transition:opacity .8s ease; }
body.bye .screen::after{ opacity:.45; }   /* 색 띠는 길안내 때 그대로 두었다가 지울 때 캔버스가 이어받는다 */
body.bye .l-bye{ opacity:1; transition-duration:.15s; animation:byeOut .6s ease 3.4s both; }
@keyframes byeOut{ to{ opacity:0; } }
body.bye .l-bye .c{ animation:letterIn .8s cubic-bezier(.25,.6,.3,1) both; animation-delay:calc(var(--t) * .77ms + 1000ms); }
.l-bye{ font-size:36px; line-height:1.8; font-weight:500; }
body.eraseb .screen::before, body.eraseb .screen::after{ opacity:0; transition:none; }
body.eraseb .rimlight{ opacity:0; transition:opacity 1.2s ease; }
.bandc.on{ opacity:1; }

/* ---------- follow : 길안내 (피그마 3070:700) ---------- */
.nav{ position:absolute; inset:0; pointer-events:none; }
.nav > *{ opacity:0; transition:opacity .5s ease; }
body.follow .nav > *{ opacity:1; }
.navgauge, .navglow, .navarrow, .navdigits{ position:absolute; inset:0; width:1080px; height:1080px; }

/* 게이지 : 피그마 3499:7361 — 중심 (535.5,539.5) 반지름 481.7 굵기 23.6. 아래 정중앙 → 위 끝(1014.6,589) 은 핀 꼭짓점 바로 아래.
   남은 길(트랙)은 채움과 이어 붙지 않고 틈(GAP)을 두고 끊겨 있다 */
.navgauge{ fill:none; stroke-linecap:round; }
.gtrack{ stroke:rgba(255,255,255,.2); stroke-width:23.6; stroke-dasharray:0 200; transition:stroke-dasharray .5s cubic-bezier(.3,.9,.3,1), stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1); }
/* 채움 글리밍 : 글자와 같은 #FEFFF9 겹을 흐리게 깔고, 화면 오른쪽(진행 방향)으로 갈수록 짙게 */
.navglow{ pointer-events:none; filter:blur(8px);
  -webkit-mask:linear-gradient(90deg,transparent 10%,#000 90%); mask:linear-gradient(90deg,transparent 10%,#000 90%); }
.navglow{ filter:blur(6px); }
.gglow{ fill:none; stroke:#FEFFF9; stroke-width:28; stroke-linecap:round; opacity:.8;
        stroke-dasharray:100; stroke-dashoffset:100; transition:stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1); }
.gfill { stroke:#fff; stroke-width:23.6; stroke-dasharray:100; stroke-dashoffset:100;
          transition:stroke-dashoffset .5s cubic-bezier(.3,.9,.3,1); }

/* 화살표 도트 : 그룹째 회전한다 (다리가 바뀔 때 부드럽게) */
.navarrow{ transform-origin:540px 538.5px; transition:rotate 1.4s cubic-bezier(.4,0,.2,1); }
/* 도트 : 흰색에 글리밍 (#FEFFF9 번짐 두 겹) */
.navarrow circle{ fill:#fff; opacity:0; transform-box:fill-box; transform-origin:50% 50%; }
.navarrow{ filter:drop-shadow(0 0 7px rgba(254,255,249,.5)) drop-shadow(0 0 18px rgba(254,255,249,.25)); }
/* 첫 등장 : 순서와 간격을 흩어 다다닥 튀어나오게 (--d 는 JS 가 뿌린다) */
body.follow .navarrow circle{ animation:pop .16s linear both var(--d); }
@keyframes pop{ from{ opacity:0; } to{ opacity:var(--o, 1); } }
/* 위를 향할 땐 가만두지 않고 위로 두 번 쿡쿡 찌르고 쉰다 : 계속 직진.
   translate 는 rotate 바깥에서 먹으므로 화면 기준 위로 움직인다.
   1.2s 늦춰 시작 : 처음엔 도트 등장, 대각선에서 돌아올 땐 회전(1.4s)이 끝나갈 때 */
.nav.up .navarrow{ animation:poke 2.6s cubic-bezier(.45,0,.35,1) 1.2s infinite; }
@keyframes poke{
  0%, 52%, 100%{ translate:0 0; }
  15%          { translate:0 -12px; }
  29%          { translate:0 0; }
  40%          { translate:0 -7px; }
}

/* 남은 시간(분) : NDOT 47 대신 같은 도트로 직접 그린다 */
/* 색 : 주 정보는 흰색, 보조 문구는 #E7E7E7 (기록 카드와 같은 위계) */
.navdigits circle{ fill:#fff; }
/* 배치는 피그마 3499:7361 (02 · Detected · Call) : 왼쪽 여백 60, 오른쪽 목적지 글자 끝 979 · 핀 996~1032 */
.navnum{ position:absolute; left:60px; top:512.33px; font-family:'OffBit Dot'; font-weight:700; font-size:77.211px;
         line-height:.93; letter-spacing:-0.05em; color:#fff; white-space:nowrap; }
html.fb-dot .navnum{ visibility:hidden; }   /* 폰트가 없으면 도트 SVG(.navdigits) 로 */
html:not(.fb-dot) .navdigits{ display:none; }
.navm { position:absolute; left:111px; top:534px; font-family:'Helvetica Now Bold', var(--ff-en, 'Magnetik'), sans-serif; font-size:28px; font-weight:700;
        line-height:1.6; color:#fff; }
.navto{ position:absolute; left:60px; top:584px; font-size:24px; font-weight:300; line-height:1.04;
        white-space:nowrap; color:rgba(255,255,255,.5); }
.navdest{ position:absolute; right:100.65px; top:514px; font-size:28px; line-height:1.04;
          text-align:right; white-space:nowrap; color:#fff; font-weight:500; }
/* 라벨도 한 글자씩 (규칙은 위 '모든 문장' 블록). navto 는 바뀔 때마다 새로 쪼개 다시 쓴다 */

<script>
// 접속하면 바로 전체화면. 제스처 없이 거절되면 첫 입력에서 다시 시도한다.
// #cam : 카메라 테스트용 미리보기 (전체화면·자동진행 없음)
const CAM = location.hash === '#cam';
const full = () => document.documentElement.requestFullscreen?.().catch(() => {});
if (!CAM) {
  full();
  // 첫 입력은 전체화면 전환에만 쓰고 시퀀스로 흘려보내지 않는다
  addEventListener('pointerdown', e => { full(); e.stopPropagation(); }, { once: true, capture: true });

}
// 전체화면일 때만 하우징/카메라/토글을 감추고 스크린이 화면을 꽉 채운다.
// F11·맥 초록버튼 전체화면은 fullscreenchange 가 안 오므로 display-mode 도 같이 본다.
const SCREEN = location.hash === '#screen';
const fs = matchMedia('(display-mode: fullscreen)');
const kiosk = () => {
  const filled = innerWidth >= screen.width - 1 && innerHeight >= screen.height - 1;
  document.body.classList.toggle('kiosk', SCREEN || !!document.fullscreenElement || fs.matches || filled);

addEventListener('fullscreenchange', kiosk);

const fit = () => document.documentElement.style.setProperty('--s',
  Math.min(innerWidth, innerHeight) *

const PAUSE = 7;   // 문장 경계에서 건너뛸 칸 수 (1칸 = 스태거 1단위)
// 폰트 대체 판별 : Magnetik 은 설치 폰트라 폭으로, SF Pro KR 은 파일을 실제로 불러와 본다. ?fb=ko,en 로 강제
{
  const q = new URLSearchParams(location.search).get('fb');
  const root = document.documentElement.classList;
  const cx = document.createElement('canvas').getContext('2d');
  const w = f => (cx.font = f, cx.measureText('Good Afternoon 0123').width);
  if (q !== null ? q.includes('en') : w('500 40px Magnetik, monospace') === w('500 40px monospace')) root.add('fb-en');
  if (q !== null ? q.includes('dot') : w("700 40px 'OffBit Dot', monospace") === w('700 40px monospace')) root.add('fb-dot');
  const noKo = () => root.add('fb-ko');
  if (q !== null) { if (q.includes('ko')) noKo(); }
  else document.fonts.load('600 48px "SF Pro KR"', '가').then(f => { if (!f.length) noKo(); }, noKo);
}

const split = el => {
  const hold = el.classList.contains('nopause');   // 한 호흡으로 읽히는 문장
  let i = 0;
  const walk = node => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const part of child.data.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.append(part); continue; }
          const s = document.createElement('span');
          s.className = 'w'; s.style.setProperty('--i', i); s.textContent = part;
          // 문장이 끊기는 자리에서 한 박자 쉰다 (약칭 Dr. 등은 제외)
          i += !hold && /[,.?!]$/.test(part) && !/^(Dr|Mr|Ms|Mrs|St)\.$/.test(part) ? PAUSE : 1;
          frag.append(s);
        }
        child.replaceWith(frag);
      } else if (child.tagName !== 'BR') {
        walk(child);
      }
    }
  };
  walk(el);
};
document.querySelectorAll('.reveal').forEach(split);
// 글리밍 겹에 쓸 글자 복사 : 강조어의 단어(.w)마다, 인사 줄(.ln)마다
// 글리밍은 강조어 전체를 한 겹으로 (July 20. 을 단어별로 나누면 번짐이 따로 놀아 어색하다).
// --i 는 첫 단어 것을 물려받아 글자가 올라온 뒤에 번짐이 켜지게
document.querySelectorAll('.headline em').forEach(em => {
  em.classList.add('glim');
  em.dataset.t = em.textContent;
  const first = em.querySelector('.w');
  if (first) em.style.setProperty('--i', first.style.getPropertyValue('--i'));
});
document.querySelectorAll('.l-greet .ln, .l-hi .ln').forEach(l => { l.classList.add('glim'); l.dataset.t = l.textContent.replace(/\s+/g, ' ').trim(); });
// 문장 단위로 한 글자씩 : 단어(.w) 안의 글자를 인라인 .c 로 쪼개 글자마다 시작 시각 --t(ms)를 준다.
//  · 한 문장 안에서는 글자(띄어쓰기 한 칸 포함)가 30ms 간격으로 끊김 없이 흘러나온다. 등장 자체는 0.95s 라
//    여러 글자가 겹쳐 번지므로 딱딱 끊겨 보이지 않는다
//  · 쉬는 곳은 문장 끝(.?!) +450ms 와 줄이 바뀌는 자리(한국어 문구의 | ) +380ms 뿐 (겹치면 긴 쪽만).
//    띄어쓰기마다 뜸을 들이면 어색했다
//  · rate : 문장마다 흐르는 속도 (영어 인사 1.8 = 천천히, 길안내 라벨 .8)
// 일반 글자의 번짐은 옅은 색, 강조어(em)는 짙은 색. 강조어에는 첫 글자 시각 --t0, 길이 --tn, 강조어 안 순서 --ei
const GLOW_EM   = [['rgba(255,244,196,.95)', 'rgba(140,212,250,.65)'],  // 옅은 노랑 · 하늘
                   ['rgba(190,240,255,.95)', 'rgba(255,236,172,.6)'],    // 옅은 청록 · 옅은 노랑
                   ['rgba(255,250,222,.95)', 'rgba(150,224,250,.6)']];   // 흰 핵 · 하늘 (파란끼만 쓰지 않는다)
const GLOW_SOFT = GLOW_EM.map(pair => pair.map(c => c.replace(/[\d.]+\)$/, a => (parseFloat(a) * .35).toFixed(2) + ')')));
const letters = (el, rate = 1) => {
  let t = 0;
  const words = [...el.querySelectorAll('.w')];
  const STEP = 30;
  words.forEach((w, wi) => {
    const text = w.textContent; w.textContent = '';
    const em = !!w.closest('em');
    [...text].forEach((ch, j) => {
      const c = document.createElement('span');
      c.className = 'c'; c.textContent = ch;
      c.style.setProperty('--t', Math.round(t));
      const [g1, g2] = (em ? GLOW_EM : GLOW_SOFT)[(wi + j) % 3];
      c.style.setProperty('--g1', g1); c.style.setProperty('--g2', g2);
      w.append(c);
      t += STEP * rate;
    });
    const next = words[wi + 1];
    if (!next) return;
    const lineBreak = next.closest('.ln') !== w.closest('.ln');
    const pause = Math.max(/[.?!]$/.test(text) ? 450 : 0, lineBreak ? 380 : 0);
    t += (STEP + pause) * rate;   // 띄어쓰기 한 칸 + (문장 끝·줄바꿈이면) 한 박자
  });
  // 두 줄 : 둘째 줄 첫 글자 시각(--t2). 그때 문장이 반 줄 위로 올라가 두 줄이 함께 가운데에 선다
  const lns = el.querySelectorAll('.ln');
  el.classList.toggle('two', lns.length > 1);
  if (lns.length > 1) el.style.setProperty('--t2', lns[1].querySelector('.c')?.style.getPropertyValue('--t') ?? 0);
  el.querySelectorAll('em').forEach(em => {
    const cs = [...em.querySelectorAll('.c')];
    if (!cs.length) return;
    const t0 = +cs[0].style.getPropertyValue('--t'), t1 = +cs.at(-1).style.getPropertyValue('--t');
    em.style.setProperty('--t0', t0); em.style.setProperty('--tn', t1 - t0);
    cs.forEach((c, n) => c.style.setProperty('--ei', n));
  });
};
document.querySelectorAll('.headline').forEach(el => letters(el, el.matches('.l-hi, .l-bye') ? 1.8 : 1));
letters(document.querySelector('.navdest'), .8);


// ---------- follow : 길안내 ----------
const star = document.querySelector('.star');
const stroke = document.querySelector('.stroke');
// 검은 원 : 링 안쪽을 또렷하게 자르며 보이스 UI 처럼 일렁인다. 반지름이 숨쉬고(396~405),
// 둘레는 몇 개의 느린 물결(2·3·5번 굽이)이 서로 다른 속도로 흘러 정원이 아닌 살아 있는 고리가 된다.
// 영상 속 링의 등장(0~0.75s)은 쓰지 않는다 : 등장은 CSS ringIn 이 가운데에서 부드럽게 키운다
const sdisc = document.querySelector('.sdisc > i');
const RSTART = .75;
stroke.currentTime = RSTART;
const discLoop = () => {
  requestAnimationFrame(discLoop);
  if (stroke.paused) return;
  const s = performance.now() / 1000;
  const R = 400.5 + 4.5 * Math.sin(s * 1.75);
  const amp = 7 + 4 * Math.sin(s * .9);   // 일렁임 폭(px) : 말하듯 커졌다 작아졌다
  const pts = [];
  for (let i = 0; i < 90; i++) {
    const a = i / 90 * 6.2832;
    const r = R + amp * (.5 * Math.sin(3 * a + s * 1.9) + .3 * Math.sin(5 * a - s * 2.6) + .4 * Math.sin(2 * a + s * 1.1 + 1));
    pts.push(`${(540 + r * Math.cos(a)).toFixed(1)}px ${(540 + r * Math.sin(a)).toFixed(1)}px`);
  }
  sdisc.style.clipPath = `polygon(${pts.join(',')})`;
};
discLoop();
stroke.playbackRate = .8;   // 더 천천히 부드럽게 (26s → 32.6s 분량, 쓰는 구간 약 20s 라 여유)

const NS  = 'http://www.w3.org/2000/svg';

  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', x); c.setAttribute('cy', y); c.setAttribute('r', r);
  if (o != null) c.style.setProperty('--o', o);

};
const arrowSvg  = NAV.querySelector('.navarrow');

const GAP = 4.5;   // 채움 끝과 남은 길 사이 틈 (둥근 끝 두 개가 약 6px 떨어져 보이는 길이, 전체 100 기준)

  gfill.style.strokeDashoffset = v; gglow.style.strokeDashoffset = v;

  gtrack.style.strokeDasharray = `${Math.max(0, 100 - done - GAP)} 200`;

// 화살표 : 원본 (피그마) 5열 x 6행 · 도트 18개, 간격 62.914, 중심 (540,538.5)
{

    [...row].forEach((ch, c) => {
      if (ch === 'X') cells.push(dot(540 + (c - 2) * 62.914, 380.5 + r * 62.914, 25.4652));

    if (!body.classList.contains('fill')) { bx.clearRect(0, 0, 540, 540); return; }
    const t = (performance.now() - t0) / 1000;
    const a1 = 390 * sweepEase(clamp01((t - .3) / 1.7));
    const a0 = t < 1.7 ? 0 : -30 * clamp01((t - 1.7) / .3);
    const ext = t < 2 ? 1 : 1 - extEase(clamp01((t - 2) / 1.4));
    if (body.classList.contains('leave') && !outAt) outAt = t;
    const alpha = outAt ? 1 - clamp01((t - outAt) / .8) : 1;
    drawBands(a0, a1, ext, alpha);
    bandRAF = requestAnimationFrame(frame);
  };
  frame();
};

const go = n => {
  clearTimeout(timer);
  // idle 에서 나갈 때 : 배회 애니메이션을 끊으면 translate 가 0 으로 튀어 다른 물체처럼 보인다.
  // 지금 값을 인라인으로 물려 class 를 바꾸고, 다음 프레임에 지워 전환(1.2s)이 그 자리에서 이어지게 한다
  const freeze = body.classList.contains('idle') && STEPS[n] !== 'idle';
  const cs = freeze && getComputedStyle(field);
  field.style.translate = field.style.rotate = field.style.borderRadius = '';
  if (freeze) {
    field.style.translate = cs.translate; field.style.rotate = cs.rotate;
    field.style.borderRadius = cs.borderRadius;
    // 엄지척(connecting)으로 바로 가면 그 자세 그대로 옅어지게 둔다. 다른 장면은 다음 프레임에 풀어 전환이 이어지게
    if (!['connecting', 'fill'].includes(STEPS[n])) requestAnimationFrame(() => requestAnimationFrame(() => {
      field.style.translate = field.style.rotate = field.style.borderRadius = '';
    }));
  }
  if (STEPS[n] === 'idle' && body.classList.contains('bye')) eraseBands();   // 인사 뒤 : 색 띠를 돌려 지우며 구슬이 떠오른다
  body.classList.remove('out', 'leave');
  body.classList.toggle('fromfill', STEPS[n] === 'connecting' && body.classList.contains('fill'));
  if (STEPS[n] === 'fill') { window.__fillAt = performance.now(); timer = setTimeout(leaveFill, 15000); requestAnimationFrame(bandsRun); }
  body.className = body.className.replace(/\b(idle|fill|connecting|connected|message|followup|guide|follow|bye)\b/, STEPS[n]);
  if (STEPS[n] === 'follow') navRun(); else { clearTimeout(navRAF); clearInterval(roll); }
  if (STEPS[n] === 'connecting') { star.currentTime = 0; star.play().catch(() => {}); silRun(); }
  else star.pause();
  // 스트로크 : 기기 번호가 사라진 뒤 connected 에서 처음부터 켜져 I'll take you 까지 끊지 않고 (영상 26s, 쓰는 구간 약 20s)
  if (['connected', 'message', 'followup', 'guide'].includes(STEPS[n])) stroke.play().catch(() => {});
  else { stroke.pause(); stroke.currentTime = RSTART; }
  askRun(STEPS[n] === 'fill');   // 엄지척(connecting)부터는 마지막 문구 그대로
  // idle 은 얼굴이 가까워져야, fill 은 엄지척이어야만 다음으로 : 별 모션은 반드시 엄지척이 인식된 뒤에만 재생
  // (카메라가 없으면 idle 은 탭으로 넘길 수 있다)
  if (HOLD[n] && !['idle', 'fill'].includes(STEPS[n])) timer = setTimeout(() => {
    if (STEPS[n] !== 'connecting') return go((n + 1) % STEPS.length);
    body.classList.add('out');   // 실루엣 도형이 하나씩 다 꺼진 뒤(1.1s) 스트로크로
    timer = setTimeout(() => go(n + 1), 750);   // 도형이 가운데 고리에 모여드는 사이 스트로크가 같은 자리에서 켜져 이어받는다
  }, HOLD[n]);
};
const step = () => STEPS.findIndex(s => body.classList.contains(s));
const leaveFill = () => {
  if (!body.classList.contains('fill') || body.classList.contains('leave')) return;
  body.classList.add('leave');
  clearTimeout(timer); timer = setTimeout(() => go(0), 850);
};
window.__leaveFill = leaveFill;
// 카메라가 없을 때의 수동 진행 : 한 단계씩, 마지막에서 리셋
const tap = () => {
  const n = step();
  if (STEPS[n] === 'fill') return;   // 탭으로는 엄지척을 건너뛸 수 없다
  go(n < 0 || n === STEPS.length - 1 ? 0 : n + 1);
};
window.__go = go; window.__step = step;
// ?s=N : 그 장면 하나만 정지 (이미지 내보내기용)
const SOLO = new URLSearchParams(location.search).get('s');
if (SOLO !== null) { body.classList.add('bare','shot'); fit(); go(+SOLO); clearTimeout(timer); }
else go(0);   // 접속하자마자 자동 시퀀스 시작

// 목업 테두리 토글 : --fit 이 바뀌므로 fit() 재계산
const jump = document.querySelector('.jump');
jump.addEventListener('pointerdown', e => e.stopPropagation());
jump.addEventListener('click', e => {
  const k = e.target.dataset?.go;
  if (!k) return;
  if (k === 'end') window.__navEnd = true;
  go(STEPS.indexOf(k === 'end' ? 'follow' : k));
});
const markJump = () => {
  const cur = STEPS[step()], navEnd = cur === 'follow' && NAV.classList.contains('arrived') || cur === 'bye';
  for (const b of jump.children) b.classList.toggle('on',
    b.dataset.go === 'end' ? navEnd :
    b.dataset.go === 'connected' ? ['connected', 'message', 'followup', 'guide'].includes(cur) :
    b.dataset.go === 'follow' ? cur === 'follow' && !navEnd :
    b.dataset.go === 'idle' ? ['idle', 'fill'].includes(cur) : b.dataset.go === cur);
};
setInterval(markJump, 250);
const toggle = document.querySelector('.toggle');
toggle.addEventListener('pointerdown', e => e.stopPropagation());
toggle.addEventListener('click', () => {
  const off = body.classList.toggle('bare');
  toggle.setAttribute('aria-pressed', String(!off));
  fit();
});

addEventListener('pointerdown', tap);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') tap(); });
</script>

<script type="module">
/* ---------- 카메라 인터랙션 ----------
   idle  : 얼굴이 가까워지면(≈30cm 이내) 원이 커진다
   idle · fill : 엄지척을 올리면 connecting 으로 넘어간다 (얼굴 근접을 거치지 않아도 된다)
   두 모델을 매 프레임 같이 돌려 썸네일에 항상 인식 결과를 그린다.
   카메라/권한이 없으면 조용히 꺼지고 탭 조작만 남는다. */

// ponytail: 웹캠 화각마다 다르므로 실기기에서 이 값들만 보정한다.
// 얼굴 폭 ÷ 프레임 폭. 화각 65° 기준 0.34 ≈ 30cm, 0.5 ≈ 20cm
const NEAR  = .34;
const HITS  = 3;     // 트리거까지 필요한 누적 프레임
const GMIN  = .35;   // 엄지척으로 인정할 최소 점수

const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';
const M = 'https://storage.googleapis.com/mediapipe-models';
const stat  = document.querySelector('.camstat');
const video = document.getElementById('camv');
const cv    = document.getElementById('camc');
const cx    = cv.getContext('2d');
const say   = t => { stat.textContent = t; };

let fd, gr, seg, hits = 0, last = -1, faceAt = 0;

const loop = () => {
  requestAnimationFrame(loop);
  const t = performance.now();
  if (t - last < 100) return;          // 10fps 면 충분
  last = t;
  if (!video.videoWidth) return;

  const face = fd.detectForVideo(video, t).detections[0];
  const hand = gr.recognizeForVideo(video, t);
  const ratio = face ? face.boundingBox.width / video.videoWidth : 0;
  // 두 손 중 아무 손이나 엄지척이면 인정
  const g = (hand.gestures ?? []).map(c => c[0]).filter(Boolean)
              .sort((x, y) => y.score - x.score)[0];
  const up = (hand.gestures ?? []).some(c => c.some(k => k.categoryName === 'Thumb_Up' && k.score >= GMIN));

  // 썸네일 오버레이
  const sx = cv.width / video.videoWidth, sy = cv.height / video.videoHeight;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (face) {
    const b = face.boundingBox;
    cx.strokeStyle = ratio >= NEAR ? '#3ddc84' : '#ffcc00';
    cx.lineWidth = 3;
    cx.strokeRect(b.originX * sx, b.originY * sy, b.width * sx, b.height * sy);
  }
  for (const marks of hand.landmarks ?? []) {
    cx.fillStyle = up ? '#3ddc84' : '#4aa8ff';
    for (const p of marks) {
      cx.beginPath(); cx.arc(p.x * cv.width, p.y * cv.height, 3, 0, 6.284); cx.fill();
    }
  }

  const n = window.__step();
  if (face) faceAt = t;
  if (n === 1 && t - Math.max(faceAt, window.__fillAt || 0) > 4000) window.__leaveFill();   // 안내를 보고 있지 않으면
  if (n === 2 && seg) {   // connecting 동안만 : 사람 모양 마스크
    const r = seg.segmentForVideo(video, t), m = r.confidenceMasks?.[0];
    if (m) window.__silMask = { w: m.width, h: m.height, data: m.getAsFloat32Array().slice() };
    r.close?.();
  }
  say('얼굴 ' + (ratio ? Math.round(ratio * 100) + '%' : '—') + ' / ' + Math.round(NEAR * 100) + '%\n'
    + '제스처 ' + (g ? g.categoryName + ' ' + g.score.toFixed(2) : '—') + '\n'
    + (n === 0 ? '얼굴을 가까이 또는 엄지척' : n === 1 ? '엄지척을 올리세요' : '진행 중'));

  // 트리거 : 놓친 프레임 하나에 초기화되지 않게 깎기만 한다
  // 엄지척은 idle 에서도 바로 connecting 으로 (얼굴 근접 단계를 건너뛴다)
  const to = n <= 1 && up ? 2 : n === 0 && ratio >= NEAR ? 1 : 0;
  hits = to ? hits + 1 : Math.max(0, hits - 1);
  if (to && hits >= HITS) { hits = 0; window.__go(to); }
};

// ?s=N (이미지 내보내기) 에서만 끈다
if (new URLSearchParams(location.search).has('s')) document.querySelector('.cam').remove();
else try {
  const { FilesetResolver, FaceDetector, GestureRecognizer, ImageSegmenter } = await import(V + '/vision_bundle.mjs');
  const vision = await FilesetResolver.forVisionTasks(V + '/wasm');
  [fd, gr] = await Promise.all([
    FaceDetector.createFromOptions(vision, { runningMode: 'VIDEO',
      baseOptions: { modelAssetPath: M + '/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' } }),
    GestureRecognizer.createFromOptions(vision, { runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: .4, minHandPresenceConfidence: .4, minTrackingConfidence: .4,
      cannedGesturesClassifierOptions: { scoreThreshold: .2 },
      baseOptions: { modelAssetPath: M + '/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task' } }),
  ]);
  // 실루엣용 사람 분리 : 늦게 뜨거나 실패해도 나머지 인식은 그대로 (실루엣은 대신 그린 모양으로)
  ImageSegmenter.createFromOptions(vision, { runningMode: 'VIDEO', outputConfidenceMasks: true, outputCategoryMask: false,
    baseOptions: { modelAssetPath: M + '/image_segmenter/selfie_segmenter/float16/latest/selfie_segmenter.tflite' } })
    .then(x => { seg = x; }).catch(e => console.warn('[seg]', e));
  say('카메라 권한을 허용해 주세요');
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
  await video.play();
  say('카메라 ON');
  window.__cam = true;
  requestAnimationFrame(loop);
} catch (e) {
  say('카메라 없음 — 엄지척을 인식할 수 없어 fill 에서 멈춤');
  console.warn('[cam]', e);
}
</script>
