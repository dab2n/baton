<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Circular Screen · 02 Detected · Call</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
/* 좌표계 : 피그마 1080 단위를 그대로 CSS px 로 쓰고 마지막에 통째로 scale()
   좌표는 모두 padding box 기준 (= 피그마 좌표 - 20px 보더)

   상태 6단계 : idle → fill → connecting → connected → message → doctor
   배경 레이어 4장(A~D)이 좌표만 바꿔가며 전 구간을 이어간다. 화면을 갈아끼우지 않는다.
     A .field  Ellipse 59    큰 그라디언트 필드 (idle 에선 중앙의 작은 원)
     B .sheen  Ellipse 58    424x420 #DEF2FF   — 전 구간 고정
     C .core   Ellipse 31229 332x328 #FDFFDE   — connecting 부터 등장
     D .cyan   Ellipse 60    시안 블롭
*/

:root{ --fit: 1238; }          /* 미리보기 : 하우징 자리를 늘 비워둔다 (토글해도 크기 불변) */
body.kiosk{ --fit: 1080; }     /* #screen : 실기기, 스크린이 화면을 꽉 채움 */

*{ box-sizing: border-box; }
html,body{ height:100%; margin:0; overflow:hidden; background:#fff; }
body{
  display:flex; align-items:center; justify-content:center;
  font-family:'Delight','Pretendard','Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none;
}

.device{ position:relative; width:1080px; height:1080px; flex:none; transform:scale(var(--s,1)); }

/* ---------- 제품 하우징 (피그마 그룹 = 임의 표현) ---------- */
.ring{
  position:absolute; inset:-78.8px; border-radius:50%;   /* 1237.6 */
  background:#f3e682;
  box-shadow:0 24px 70px rgba(0,0,0,.16);
}
.ring::before{                                            /* 1191.2 */
  content:''; position:absolute; inset:23.2px; border-radius:50%;
  background:radial-gradient(circle closest-side,#cdc47e 90.4%,#fff8c1 100%);
}
body.bare .ring{ display:none; }

/* ---------- 목업 테두리 온오프 토글 (중앙 프레임과 겹치지 않게 우측) ---------- */
.toggle{
  position:fixed; right:16px; top:50%; translate:0 -50%; z-index:10;
  display:flex; align-items:center; gap:9px;
  padding:9px 14px 9px 10px; border:1px solid rgba(0,0,0,.14); border-radius:999px;
  background:#fff; color:#000; cursor:pointer;
  font:inherit; font-size:12px; font-weight:500; line-height:1;
  box-shadow:0 2px 12px rgba(0,0,0,.14);
}
.toggle:hover{ background:#f2f2f2; }
.toggle .sw{
  width:34px; height:20px; border-radius:999px; flex:none;
  background:#000; transition:background-color .2s;
}
.toggle .sw::after{
  content:''; display:block; width:16px; height:16px; margin:2px; border-radius:50%;
  background:#fff; transform:translateX(14px); transition:transform .2s;
}
body.bare .toggle .sw{ background:#d6d6d6; }
body.bare .toggle .sw::after{ transform:none; }
body.kiosk .toggle{ display:none; }   /* #screen : 실기기에선 숨김 */

/* 카메라 모니터 (테스트용) */
.cam{ position:fixed; right:16px; bottom:16px; z-index:10; width:240px; }
.camview{ display:grid; aspect-ratio:4/3; border-radius:10px; overflow:hidden;
          background:#111; box-shadow:0 2px 12px rgba(0,0,0,.18); }
.camview > *{ grid-area:1/1; width:100%; height:100%; transform:scaleX(-1); }
.camview video{ object-fit:cover; }
.camstat{ margin-top:6px; font-size:11px; line-height:1.5; color:#888;
          text-align:right; white-space:pre-line; }
body.kiosk .cam{ display:none; }

/* ---------- 스크린 1080x1080 ---------- */
.screen{
  position:absolute; inset:0; border-radius:50%;
  background:#000; overflow:hidden;
}
.bezel{ position:absolute; inset:0; width:1080px; height:1080px;
        z-index:4; pointer-events:none; }

/* ---------- 배경 레이어 : 기본값 = message(본문) 상태 ---------- */
/* blur 는 래퍼에 : 자식을 scale() 해도 흐림 반경이 같이 커지지 않게 */
.blur39{ position:absolute; inset:0; filter:blur(39px); }
.field{ position:absolute; left:28px; top:-132px; width:1022px; height:1053px;
        border-radius:50%; background:linear-gradient(180deg,#fff 23.89%,#f6e280 100%); }
.sheen{ position:absolute; left:413px; top:-72px; width:424px; height:420px;
        border-radius:50%; background:#def2ff; opacity:.82; filter:blur(100px); }
.core { position:absolute; left:330px; top:454px; width:332px; height:328px;
        border-radius:50%; background:#fdffde; filter:blur(100px); }
.cyan { position:absolute; left:31px; top:-186px; width:1116px; height:828px;
        opacity:.27; filter:blur(100px); }

.field,.sheen,.core,.cyan{
  transform-origin:50% 50%;
  transition:transform 1.8s cubic-bezier(.45,0,.15,1), opacity 1.2s ease,
             translate 1.2s ease, scale 1.2s ease, rotate 1.2s ease,
             border-radius 1.2s ease;
}

/* A : 중앙의 작은 원 → 화면을 채움 → 각 장면의 좌표로 흘러감 */
body.idle       .field{ transform:translate(1px,145.5px) scale(.167,.157); }
/* 1.14 = 1022x1053 타원이 지름 1080 원을 완전히 덮는 배율(블러 39px 여유 포함) */
body.fill       .field{ transform:translate(1px,145.5px) scale(1.2); }
/* connecting : 중심 원은 작게 물러나고 가장자리 스캔이 주인공 */
body.connecting .field{ transform:translate(1px,145.5px) scale(.58); }
body.connected  .field,
body.message    .field,
body.doctor     .field,
body.guide      .field{ transform:translate(1px,145.5px) scale(1.2); }

/* C : connecting 에서 켜지고 doctor 에서 꺼짐 */
/* 노치가 작아져 상단이 드러난다 : idle 은 순수 블랙이어야 하므로 sheen 을 끈다 */
body.idle .sheen{ opacity:0; }
body.idle .core, body.fill .core{ transform:scale(.4); opacity:0; }
body.connecting  .core{ transform:translate(9px,-29px); }

/* D : 본문 장면에서만 크게 */
body.idle .cyan, body.fill .cyan, body.connecting .cyan{
  transform:translate(9px,172.5px) scale(.469); opacity:.09;
}

/* 살아있는 듯한 움직임 : transform 은 상태 전환이 쓰므로 개별 속성으로 분리.
   합성 순서상 translate 는 scale 바깥이라, 작을 때는 크게 배회하고 클 때는 은근하게 흐른다. */
/* 배회는 idle 에서만. 원이 커진 뒤에는 멈추고 중앙에 정렬된다 */
/* 위치 이동(wander)은 드물게, 가장자리 일렁임(ripple/sway)은 멈춰 있는 동안에도 계속.
   ripple 은 실루엣을 흔들고, sway 는 그라디언트의 흰 광을 테두리 따라 훑어 보낸다.
   세 주기가 서로 안 나누어떨어져 같은 모양이 반복되지 않는다. */
body.idle .field{
  animation:wander 30s linear      infinite,
            ripple  6s ease-in-out infinite,
            sway    7s ease-in-out infinite alternate;
}
/* 정적 장면에서 .field 를 움직이면 어떻게든 검정이 드러난다. 고정.
   대신 그 위의 파란 블롭(sheen/cyan)이 크게 흘러다니고,
   본문 텍스트가 color-burn 이라 지나갈 때마다 글자 색이 미묘하게 바뀐다. */
body:not(.idle) .field{ animation:none; translate:0 0; scale:1; rotate:0deg; border-radius:50%; }
.sheen{ animation:drift2 15s ease-in-out infinite alternate; }
.core { animation:drift4 19s ease-in-out infinite alternate; }
.cyan { animation:drift3 23s ease-in-out infinite alternate; }
/* 시선을 옮기는 생물처럼 : 짧고 빠르게 도약(7%) → 길게 머물며 미세하게 흔들림(18%).
   구간마다 timing-function 을 따로 줘서 도약은 튕겨나가듯, 체류는 거의 멈춘 듯 보이게 한다. */
@keyframes wander{
   0%  { translate:  0px   0px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
   7%  { translate:-46px -30px; scale:1.09 .93;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  25%  { translate:-38px -22px; scale:1.01 1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  32%  { translate: 30px -54px; scale:.92  1.11; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  48%  { translate: 24px -44px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  54%  { translate: 56px  18px; scale:1.08 .94;  animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  70%  { translate: 48px  14px; scale:1    1.01; animation-timing-function:cubic-bezier(.28,.86,.3,1); }
  77%  { translate:-28px  48px; scale:.94  1.08; animation-timing-function:cubic-bezier(.5,0,.5,1);    }
  93%  { translate:-22px  40px; scale:1    1;    animation-timing-function:cubic-bezier(.28,.86,.3,1); }
 100%  { translate:  0px   0px; scale:1    1;    }
}
@keyframes ripple{
   0%,100%{ border-radius:50% 50% 50% 50% / 50% 50% 50% 50%; }
  20%     { border-radius:63% 37% 44% 56% / 41% 59% 41% 59%; }
  40%     { border-radius:39% 61% 59% 41% / 59% 37% 63% 41%; }
  60%     { border-radius:57% 43% 37% 63% / 44% 63% 37% 56%; }
  80%     { border-radius:42% 58% 62% 38% / 61% 42% 58% 39%; }
}
@keyframes sway{ from{ rotate:-34deg; } to{ rotate:34deg; } }
@keyframes drift2{ to{ translate:-186px 268px; scale:1.55; } }
@keyframes drift3{ to{ translate:148px 244px; rotate:14deg; scale:1.2; } }
@keyframes drift4{ to{ translate:-66px 78px; scale:1.34; } }


/* ---------- connecting : 베젤 바로 안쪽이 숨쉬듯 일렁인다 (찾고 있는 상태) ---------- */
.rim{
  position:absolute; inset:0; border-radius:50%; z-index:1; pointer-events:none;
  opacity:0; transition:opacity 1s ease;
  box-shadow:inset 0 0 52px 8px rgba(255,250,214,.6);
}
/* 가장자리 안쪽이 숨쉬듯 밝아졌다 잦아든다 */
body.connecting .rim{ opacity:1; animation:breathe 3.4s ease-in-out infinite; }
@keyframes breathe{
  0%,100%{ box-shadow:inset 0 0 44px  4px rgba(255,250,214,.45); }
  50%    { box-shadow:inset 0 0 104px 30px rgba(255,250,214,.92); }
}
/* 밝은 구역 하나가 아주 느리게 둘레를 돈다 (등속이지만 11s + 큰 블러라 훑는 티가 안 난다) */
.rim::after{
  content:''; position:absolute; inset:0; border-radius:inherit; opacity:0;
  background:radial-gradient(circle at 50% 3%, rgba(255,255,255,.9), transparent 44%);
  filter:blur(44px); transition:opacity 1s ease;
}
body.connecting .rim::after{ opacity:1; animation:orbit 11s linear infinite; }
@keyframes orbit{ to{ rotate:360deg; } }

/* ---------- 병원 칩 : 스크린 상단에서 아래로 내려온다 ---------- */
.pill{
  position:absolute; left:50%; top:150px; transform:translateX(-50%); z-index:3;
  display:grid; place-items:center; padding:12px 30px;
  border-radius:999px; overflow:hidden;
  opacity:0; translate:0 -30px;
  transition:opacity .5s ease, translate .8s cubic-bezier(.3,.9,.3,1);
}
body.connected .pill{ opacity:1; translate:0 0; }

.pbg{ position:absolute; inset:0; border-radius:inherit;
      background:rgba(255,248,190,.2); mix-blend-mode:color-burn; }
.pill::after{ content:''; position:absolute; inset:0; border-radius:inherit;
              box-shadow:inset 0 0 10px 0 #fff; pointer-events:none; }

.pc{ grid-area:1/1; display:flex; align-items:center; justify-content:center;
     opacity:0; white-space:nowrap; transition:opacity .4s ease; }
body.connected .pc-hospital{ opacity:1; transition-delay:.25s; }
.pc-hospital{ gap:12px; }
.vial{
  width:33.35px; height:59.75px; flex:none;
  background:linear-gradient(180deg,#ffff80 0%,#ffc943 100%);

/* ---------- 본문 ---------- */
.headline, .docname{
  position:absolute; left:50%; transform:translateX(-50%);
  margin:0; width:780px; text-align:center;
  font-size:42px; font-weight:500; line-height:1.6; color:#3e3d0a;
  mix-blend-mode:color-burn;
  transition:opacity .8s ease;
}
/* 줄 수와 무관하게 스크린 정중앙 (사진과 짝인 .docname 만 예외) */
.headline{ top:50%; transform:translate(-50%,-50%); }
.docname { top:calc(50% - 372px); }
.headline em{ font-style:normal; font-weight:600; }

/* 장면당 한 문장. 들어올 때는 즉시, 나갈 때만 천천히 사라진다 */
.headline, .docname{ opacity:0; }
body.fill    .l-greet,
body.connected .l-hi,
body.message .l-msg,
body.guide   .l-guide,
body.doctor  .docname,
body.doctor  .docmeta{ opacity:1; transition-duration:.15s; }

/* 엄지척 이전(=greet) : color-burn 의 투명감 없이 단색으로 */
.l-greet{ mix-blend-mode:normal; }

/* 모션: DOM 순서 = 위 → 아래, 왼 → 오른쪽 */
.w{ display:inline-block; opacity:0; will-change:transform,opacity,filter; }
body.fill    .l-greet .w,
body.connected .l-hi  .w,
body.guide   .l-guide .w,
body.message .l-msg   .w{
  animation:in .9s cubic-bezier(.2,.7,.2,1) both;
  animation-delay:calc(var(--i) * 70ms + 200ms);
}
/* 원이 화면을 다 채운 다음(transform 1.8s)에 이어서 올라온다 */
body.fill .l-greet .w{ animation-delay:calc(var(--i) * 70ms + 1750ms); }
/* 칩이 먼저 내려앉고(0.8s) 그 다음 문장 */
body.connected .l-hi .w{ animation-delay:calc(var(--i) * 70ms + 1150ms); }
/* 두 단어뿐이라 같은 70ms 로는 티가 안 난다. 간격을 벌리고 사진이 자리잡은 뒤에 올린다 */
body.doctor  .docname  .w{
  animation:in .9s cubic-bezier(.2,.7,.2,1) both;
  animation-delay:calc(var(--i) * 190ms + 500ms);
}
/* 예약 정보 : 사진 아래, 본문보다 한 단계 작게 */
.docmeta{
  position:absolute; left:50%; transform:translateX(-50%);
  margin:0; width:620px; top:calc(50% + 300px); text-align:center;
  font-size:30px; font-weight:400; line-height:1.55; color:#3e3d0a;
  mix-blend-mode:color-burn; opacity:0; transition:opacity .8s ease;
}
.docmeta em{ font-style:normal; font-weight:600; }
body.doctor .docmeta .w{
  animation:in .9s cubic-bezier(.2,.7,.2,1) both;
  animation-delay:calc(var(--i) * 90ms + 950ms);
}
@keyframes in{
  from{ opacity:0; transform:translateY(.42em); filter:blur(10px); }
  to  { opacity:1; transform:none;              filter:blur(0);    }
}

/* ---------- 의료진 사진 ---------- */
.photo{
  position:absolute; left:245px; top:245px; width:590px; height:590px;
  object-fit:cover; opacity:0; transform:scale(.92);
  transition:opacity .9s ease, transform 1.1s cubic-bezier(.3,.9,.3,1);
  -webkit-mask:radial-gradient(circle closest-side,#000 49.8%,transparent 100%);
          mask:radial-gradient(circle closest-side,#000 49.8%,transparent 100%);
}
body.doctor .photo{ opacity:1; transform:scale(1); transition-delay:.15s; }

@media (prefers-reduced-motion:reduce){
  .w{ animation:none; opacity:1; }
  .field,.sheen,.core,.cyan,.rim,.rim::after{ animation:none; }
}

<script>
if (location.hash === '#screen') document.body.classList.add('bare','kiosk');

// scale() 은 단위 없는 수만 받으므로 JS로 계산 (CSS calc 로는 px/숫자 → px 라 불가)
const FILL = .92;   // 미리보기 여백. 실기기(#screen)는 항상 꽉 채움
const fit = () => document.documentElement.style.setProperty('--s',
  Math.min(innerWidth, innerHeight) * (document.body.classList.contains('kiosk') ? 1 : FILL) /
  parseFloat(getComputedStyle(document.body).getPropertyValue('--fit')));
addEventListener('resize', fit);
fit();

// 텍스트를 단어 단위로 쪼개고 DOM 순서대로 딜레이 부여
const PAUSE = 7;   // 문장 경계에서 건너뛸 칸 수 (1칸 = 스태거 1단위)
const split = el => {
  const hold = el.classList.contains('nopause');   // 한 호흡으로 읽히는 문장
  let i = 0;
  const walk = node => {
    for (const child of [...node.childNodes]) {
      if (child.nodeType === 3) {
        const frag = document.createDocumentFragment();
        for (const part of child.data.split(/(\s+)/)) {
          if (!part) continue;
          if (/^\s+$/.test(part)) { frag.append(part); continue; }
          const s = document.createElement('span');
          s.className = 'w'; s.style.setProperty('--i', i); s.textContent = part;
          // 문장이 끊기는 자리에서 한 박자 쉰다 (약칭 Dr. 등은 제외)
          i += !hold && /[,.?!]$/.test(part) && !/^(Dr|Mr|Ms|Mrs|St)\.$/.test(part) ? PAUSE : 1;
          frag.append(s);
        }
        child.replaceWith(frag);
      } else if (child.tagName !== 'BR') {
        walk(child);
      }
    }
  };
  walk(el);
};
document.querySelectorAll('.reveal').forEach(split);

// 시퀀스 : 한 번 누르면 끝까지 자동 진행, 다시 누르면 idle 로 리셋
// fill 은 엄지척(또는 탭)을 기다리므로 자동 진행하지 않는다
const STEPS = ['idle','fill','connecting','connected','message','doctor','guide'];
const HOLD  = [0, 0, 4200, 6000, 6400, 7200, 0];   // 각 상태에 머무는 시간(ms)
const body = document.body;
let timer;

const go = n => {
  clearTimeout(timer);
  body.className = body.className.replace(/\b(idle|fill|connecting|connected|message|doctor|guide)\b/, STEPS[n]);
  if (HOLD[n]) timer = setTimeout(() => go(n + 1), HOLD[n]);
};
const step = () => STEPS.findIndex(s => body.classList.contains(s));
// 카메라가 없을 때의 수동 진행 : 한 단계씩, 마지막에서 리셋
const tap = () => { const n = step(); go(n < 0 || n === STEPS.length - 1 ? 0 : n + 1); };
window.__go = go; window.__step = step;

// 목업 테두리 토글 : --fit 이 바뀌므로 fit() 재계산
const toggle = document.querySelector('.toggle');
toggle.addEventListener('pointerdown', e => e.stopPropagation());
toggle.addEventListener('click', () => {
  const off = body.classList.toggle('bare');
  toggle.setAttribute('aria-pressed', String(!off));
  fit();
});

addEventListener('pointerdown', tap);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') tap(); });
</script>

<script type="module">
/* ---------- 카메라 인터랙션 ----------
   idle  : 얼굴이 가까워지면(≈30cm 이내) 원이 커진다
   fill  : 엄지척을 올리면 connecting 으로 넘어간다
   두 모델을 매 프레임 같이 돌려 썸네일에 항상 인식 결과를 그린다.
   카메라/권한이 없으면 조용히 꺼지고 탭 조작만 남는다. */

// ponytail: 웹캠 화각마다 다르므로 실기기에서 이 값들만 보정한다.
// 얼굴 폭 ÷ 프레임 폭. 화각 65° 기준 0.34 ≈ 30cm, 0.5 ≈ 20cm
const NEAR  = .34;
const HITS  = 3;     // 트리거까지 필요한 누적 프레임
const GMIN  = .35;   // 엄지척으로 인정할 최소 점수

const V = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18';
const M = 'https://storage.googleapis.com/mediapipe-models';
const stat  = document.querySelector('.camstat');
const video = document.getElementById('camv');
const cv    = document.getElementById('camc');
const cx    = cv.getContext('2d');
const say   = t => { stat.textContent = t; };

let fd, gr, hits = 0, last = -1;

const loop = () => {
  requestAnimationFrame(loop);
  const t = performance.now();
  if (t - last < 100) return;          // 10fps 면 충분
  last = t;
  if (!video.videoWidth) return;

  const face = fd.detectForVideo(video, t).detections[0];
  const hand = gr.recognizeForVideo(video, t);
  const ratio = face ? face.boundingBox.width / video.videoWidth : 0;
  // 두 손 중 아무 손이나 엄지척이면 인정
  const g = (hand.gestures ?? []).map(c => c[0]).filter(Boolean)
              .sort((x, y) => y.score - x.score)[0];
  const up = (hand.gestures ?? []).some(c => c.some(k => k.categoryName === 'Thumb_Up' && k.score >= GMIN));

  // 썸네일 오버레이
  const sx = cv.width / video.videoWidth, sy = cv.height / video.videoHeight;
  cx.clearRect(0, 0, cv.width, cv.height);
  if (face) {
    const b = face.boundingBox;
    cx.strokeStyle = ratio >= NEAR ? '#3ddc84' : '#ffcc00';
    cx.lineWidth = 3;
    cx.strokeRect(b.originX * sx, b.originY * sy, b.width * sx, b.height * sy);
  }
  for (const marks of hand.landmarks ?? []) {
    cx.fillStyle = up ? '#3ddc84' : '#4aa8ff';
    for (const p of marks) {
      cx.beginPath(); cx.arc(p.x * cv.width, p.y * cv.height, 3, 0, 6.284); cx.fill();
    }
  }

  const n = window.__step();
  say('얼굴 ' + (ratio ? Math.round(ratio * 100) + '%' : '—') + ' / ' + Math.round(NEAR * 100) + '%\n'
    + '제스처 ' + (g ? g.categoryName + ' ' + g.score.toFixed(2) : '—') + '\n'
    + (n === 0 ? '얼굴을 가까이' : n === 1 ? '엄지척을 올리세요' : '진행 중'));

  // 트리거 : 놓친 프레임 하나에 초기화되지 않게 깎기만 한다
  const wants = n === 0 ? ratio >= NEAR : n === 1 ? up : false;
  hits = wants ? hits + 1 : Math.max(0, hits - 1);
  if (wants && hits >= HITS) { hits = 0; window.__go(n + 1); }
};

try {
  const { FilesetResolver, FaceDetector, GestureRecognizer } = await import(V + '/vision_bundle.mjs');
  const vision = await FilesetResolver.forVisionTasks(V + '/wasm');
  [fd, gr] = await Promise.all([
    FaceDetector.createFromOptions(vision, { runningMode: 'VIDEO',
      baseOptions: { modelAssetPath: M + '/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' } }),
    GestureRecognizer.createFromOptions(vision, { runningMode: 'VIDEO', numHands: 2,
      minHandDetectionConfidence: .4, minHandPresenceConfidence: .4, minTrackingConfidence: .4,
      cannedGesturesClassifierOptions: { scoreThreshold: .2 },
      baseOptions: { modelAssetPath: M + '/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task' } }),
  ]);
  say('카메라 권한을 허용해 주세요');
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: 'user' } });
  await video.play();
  say('카메라 ON');
  requestAnimationFrame(loop);
} catch (e) {
  say('카메라 없음 — 화면을 탭해 진행');
  console.warn('[cam]', e);
}
</script>
